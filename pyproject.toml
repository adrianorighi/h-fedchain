[project]
name = "h-fedchain"
version = "0.1.0"
description = "H-FedChain: Hierarchical Edge-Fog-Cloud with HotStuff BFT consensus for secure FL in IoHT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "cryptography>=41.0",
    "wfdb>=4.1.0",
    "py_ecc>=8.0.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
zkp = ["pysnark", "ethstark"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]
distributed = ["grpcio>=1.60", "grpcio-tools>=1.60", "protobuf>=4.25", "paho-mqtt>=1.6"]

[tool.setuptools.packages.find]
include = ["hfc_types*", "core*", "zkp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
