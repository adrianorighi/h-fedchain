# H-FedChain local MQTT broker (eclipse-mosquitto:2)
listener 1883 0.0.0.0
allow_anonymous true

# Retained messages (device registrations on register/<cluster>/#, global
# models on models/global) MUST survive a broker restart: persistence writes
# them to disk, autosave_interval 1 flushes every second so a crash loses at
# most ~1s of retained state.
persistence true
persistence_location /mosquitto/data/
autosave_interval 1

# container-friendly logging (docker logs / docker compose logs)
log_dest stdout

# T14: a single gradient pickle is ~3.1MB (MLP12000x64 float32) and the
# retained models/global delta is the same size; the broker's default
# packet cap (~1MiB in mosquitto 2.1) disconnects clients with
# "oversize packet". Explicit high cap for the pipeline payloads.
max_packet_size 67108864
